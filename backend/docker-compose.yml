version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow123
      POSTGRES_DB: studyflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://studyflow:studyflow123@db:5432/studyflow
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: